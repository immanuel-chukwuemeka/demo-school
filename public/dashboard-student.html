<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal — Greenwood Academy</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="dash-body">
  <div id="authGate" class="dash-shell hidden">
    <div style="grid-column:1/-1;min-height:100vh;display:grid;place-items:center"><div class="loader"></div></div>
  </div>
  <div id="appRoot" class="dash-shell hidden">
    <aside class="dash-side" id="dashSide">
      <a class="brand" href="index.html" aria-label="Home"><img src="assets/logo/logo-white.svg" alt=""><span class="brand-name">Greenwood Student<br><small>Student Portal</small></span></a>
      <nav id="sideNav" aria-label="Student menu"><!-- injected --></nav>
      <div class="side-foot"><button class="side-link" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button></div>
    </aside>
    <div class="side-backdrop" id="sideBackdrop"></div>
    <main class="dash-main" id="dashMain">
      <div class="dash-top">
        <button class="menu-btn" id="menuBtn" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
        <div class="dash-top-right">
          <button class="dbtn dbtn-soft" onclick="window.open('index.html','_blank')"><i class="fa-solid fa-globe"></i> View Site</button>
          <div class="user-chip"><img id="userAvatar" src="assets/logo/favicon.svg" alt=""><div class="uc-txt"><b id="userName">Student</b><span id="userRole">Student</span></div></div>
        </div>
      </div>
      <div class="dash-content" id="viewRoot">
        <div style="display:grid;place-items:center;min-height:50vh"><div class="loader"></div></div>
      </div>
    </main>
  </div>
  <script type="module" src="js/dashboards/student/main.js"></script>
</body>
</html>

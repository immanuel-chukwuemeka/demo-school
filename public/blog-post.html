<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Article — {name}</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="media">
  <header class="site-header" id="site-header"></header>
  <section class="page-hero">
    <img class="pbg" id="phBg" src="assets/images/blog/blog-1.jpg" alt="">
    <div class="container"><span class="kicker" style="position:relative;z-index:2">Blog</span><h1 id="phTitle">Article</h1></div>
  </section>
  <section class="section">
    <div class="container">
      <div id="postBody" style="width:min(820px,100%);margin-inline:auto"><div class="loader"></div></div>
      <div id="related" style="width:min(1100px,100%);margin-inline:auto;margin-top:60px"></div>
    </div>
  </section>
  <footer class="site-footer" id="site-footer"></footer>
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/pages/blog-post.js"></script>
</body>
</html>

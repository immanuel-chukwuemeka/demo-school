<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News &amp; Activities — {name}</title>
  <meta name="description" content="Latest news and activities from {name}: results, admissions, events and campus updates.">
  <link rel="icon" type="image/svg+xml" href="assets/logo/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="media">
  <header class="site-header" id="site-header"></header>
  <section class="page-hero">
    <img class="pbg" src="assets/images/hero/morning-assembly.jpg" alt="">
    <div class="container">
      <span class="kicker" style="position:relative;z-index:2">News</span>
      <h1>News &amp; Campus Updates</h1>
      <div class="crumbs"><a href="index.html">Home</a><span class="sep">/</span><span>News &amp; Activities</span></div>
    </div>
  </section>
  <section class="section">
    <div class="container">
      <div class="flex" style="justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:14px">
        <div><span class="kicker">Latest</span><h2 style="font-size:1.7rem">School News</h2></div>
        <a href="blog.html" class="btn btn-soft" style="background:var(--color-cloud);border:2px solid var(--color-border);color:var(--color-primary-dark)"><i class="fa-solid fa-pen-nib"></i> Read Our Blog</a>
      </div>
      <div id="newsGrid" class="grid grid-3 stagger"><div class="loader" style="grid-column:1/-1"></div></div>
    </div>
  </section>
  <section class="section section-tint">
    <div class="container">
      <div class="flex" style="justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:14px">
        <div><span class="kicker">Events</span><h2 style="font-size:1.7rem">Upcoming Activities</h2></div>
        <a href="activities.html" class="btn btn-soft" style="background:var(--color-cloud);border:2px solid var(--color-border);color:var(--color-primary-dark)">All Events <i class="fa-solid fa-arrow-right"></i></a>
      </div>
      <div id="miniEvents" class="grid grid-3 stagger"><div class="loader" style="grid-column:1/-1"></div></div>
    </div>
  </section>
  <footer class="site-footer" id="site-footer"></footer>
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/pages/news.js"></script>
</body>
</html>
